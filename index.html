*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;align-items:center;background:linear-gradient(90deg,rgba(19,12,21,.11) 20%,rgba(19,12,21,.35) 65%,rgba(19,12,21,.58)),var(--scene) center center/cover no-repeat}
main{width:min(100% - 48px,1220px);margin:0 auto;display:flex;justify-content:flex-end;padding:44px 0}
.card{width:min(100%,460px);padding:clamp(26px,5vw,46px);background:#fff9ef;border:1px solid #e0c9a0;border-top:4px solid #bc873b;border-radius:22px;box-shadow:0 20px 80px #12091077}
.venue{margin:0;color:#694421;font-size:.82rem;font-weight:700}
h1,h2{font-family:Georgia,serif;font-weight:500;letter-spacing:-.045em;margin:12px 0 8px;line-height:1.02;font-size:clamp(2.25rem,5vw,3.5rem)}
.date{color:#665355;margin:0 0 26px;font-size:.93rem}
label{display:block;font-weight:650;margin:0 0 6px;font-size:.95rem}
label span{font-weight:500;color:#68514d}
input{width:100%;min-height:52px;padding:10px 13px;color:inherit;background:#fff;border:1px solid #ab968a;border-radius:9px;font:inherit}
input:focus-visible,button:focus-visible{outline:3px solid #8c5b16;outline-offset:3px}
.field{margin:0 0 17px}
.note{font-size:.81rem;color:#635454;line-height:1.5;margin:2px 0 17px}
button{width:100%;min-height:54px;border:0;border-radius:9px;background:#532c3b;color:#fffaf5;font:inherit;font-weight:700;cursor:pointer}
button:hover{background:#6f394d}
button:disabled{cursor:wait;opacity:.72}
.status{margin:12px 0 0;color:#8a2828;font-size:.9rem;line-height:1.45}
.status:empty{display:none}
#thanks p{line-height:1.55;margin-bottom:0}
@media(max-width:700px){body{background-position:27% top;background-size:auto min(68svh,560px);align-items:start;background-image:linear-gradient(to bottom,transparent 65%,#17121a 100%),var(--scene)}
main{justify-content:center;width:calc(100% - 30px);padding:clamp(144px,29svh,235px) 0 25px}.card{border-radius:18px}h1{font-size:2.45rem}}
</style>
</head>
<body>
<main>
<section class="card" aria-labelledby="title">
<p class="venue">Karnataka Rajyotsava at Art of Living · Bengaluru</p>
<h1 id="title">Devotee Registration</h1>
<p class="date"><time datetime="2026-11-29">Sunday, 29 November 2026</time></p>
<form id="registration" method="post" target="_self">
<div class="field">
<label for="name">Name <span lang="kn">· ಹೆಸರು</span></label>
<input id="name" name="full_name" autocomplete="name" maxlength="100" required>
</div>
<div class="field">
<label for="phone">Mobile number <span lang="kn">· ಮೊಬೈಲ್ ಸಂಖ್ಯೆ</span></label>
<input id="phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel-national" maxlength="10" pattern="[0-9]{10}" aria-describedby="phone-hint" required>
<p id="phone-hint" class="note">10 digits without +91 · <span lang="kn">+91 ಇಲ್ಲದೆ 10 ಅಂಕೆಗಳು</span></p>
</div>
<p class="note">Art of Living will use your name and mobile number to register you for this event.</p>
<button type="submit">Submit <span lang="kn">· ಸಲ್ಲಿಸಿ</span></button>
<p id="status" class="status" role="alert"></p>
</form>
<noscript><p>Enable JavaScript to submit your registration.</p></noscript>
</section>
</main>
<script>
'use strict';
const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwAJshxHnXknTJCZlmhZ-Yv3_Mr36TrLxxPqUBVko19dl-4n3Vqd6Kmdl07RkMU487i/exec';
const form = document.querySelector('#registration');
const button = form.querySelector('button');
const status = document.querySelector('#status');
let lastSubmission;

form.addEventListener('submit', event => {
  if (!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(WEB_APP_URL)) {
    event.preventDefault();
    status.textContent = 'Registration is awaiting setup. Please contact an event volunteer.';
    return;
  }
  const fullName = form.elements.full_name.value.trim();
  const phone = form.elements.phone.value.trim();
  if (!fullName) {
    event.preventDefault();
    status.textContent = 'Please enter your name.';
    form.elements.full_name.focus();
    return;
  }
  if (!lastSubmission || lastSubmission.fullName !== fullName || lastSubmission.phone !== phone) {
    const id = Array.from(crypto.getRandomValues(new Uint8Array(16)), n => n.toString(16).padStart(2, '0')).join('');
    lastSubmission = {fullName, phone, id};
  }
  form.querySelectorAll('input[type="hidden"]').forEach(input => input.remove());
  const fields = {request_id: lastSubmission.id, return_url: location.origin + location.pathname};
  for (const [key, value] of Object.entries(fields)) {
    const input = document.createElement('input');
    input.type = 'hidden';
    input.name = key;
    input.value = value;
    form.append(input);
  }
  form.action = WEB_APP_URL;
  button.disabled = true;
  status.textContent = 'Saving your registration…';
});

window.addEventListener('pageshow', () => {
  button.disabled = false;
  status.textContent = '';
});
</script>
</body>
</html>
